apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmRepository
metadata:
  name: immich
  namespace: immich
  labels:
    type: local
spec:
  interval: 24h
  url: https://immich-app.github.io/immich-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 1h
  chart:
    spec:
      chart: immich
      version: "0.12.*"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
      interval: 12h
  values:
    # Bundled Valkey replaces the old redis subchart
    valkey:
      enabled: true

    immich:
      persistence:
        # Main data store for all photos shared between different components.
        # Automatically creating the library volume is not supported by this chart
        library:
          existingClaim: immich-pv-claim
      # Hardware-accelerated video transcoding via the Vega iGPU (VA-API).
      # Requires the /dev/dri hostPath mount under server.persistence below.
      configuration:
        ffmpeg:
          accel: vaapi
          accelDecode: true

    # Shared config for all immich components (server + machine-learning)
    controllers:
      main:
        containers:
          main:
            # Chart 0.12.0 ships v2.6.3; pin the latest stable app version
            image:
              tag: v3.1.0
            env:
              # Chart defaults are a map, so passing a list replaces them
              # entirely - restate the ones the chart would have set
              - name: REDIS_HOSTNAME
                value: immich-valkey
              - name: IMMICH_MACHINE_LEARNING_URL
                value: http://immich-machine-learning:3003
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres
                    key: password
              # v3 renamed DB_DATABASE_URL to DB_URL
              - name: DB_URL
                value: postgresql://immich:$(DB_PASSWORD)@immich-postgres:5432/immich
              # Gmail SMTP for invites / password resets
              - name: EMAIL_SERVER_ADDRESS
                value: smtp.gmail.com
              - name: EMAIL_SERVER_PORT
                value: "465"
              - name: EMAIL_SERVER_SECURE
                value: "true"
              # Gmail requires From == authenticated sender
              - name: EMAIL_SERVER_FROM
                value: $(EMAIL_SERVER_USER)
              - name: EMAIL_SERVER_USER
                valueFrom:
                  secretKeyRef:
                    name: immich-email
                    key: user
              - name: EMAIL_SERVER_PASS
                valueFrom:
                  secretKeyRef:
                    name: immich-email
                    key: password

    server:
      enabled: true

      # Expose the iGPU to the server container so the transcoder can use VA-API
      persistence:
        dri:
          type: hostPath
          hostPath: /dev/dri
          advancedMounts:
            main:
              main:
                - path: /dev/dri

      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt
            external-dns.alpha.kubernetes.io/target: ${ddns_target}
          hosts:
            - host: immich.${base_domain}
              paths:
                - path: "/"
                  service:
                    identifier: main
          tls:
            - hosts:
                - immich.${base_domain}
              secretName: immich-tls
