apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-backup
spec:
  # After Immich's 02:00 DB dump so the dump is included
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.18.1
              command:
                - /bin/sh
                - -ec
                - |
                  restic cat config >/dev/null 2>&1 || restic init
                  # clear locks left by killed/crashed runs (only removes stale ones)
                  restic unlock
                  # thumbs and encoded-video are regenerated by Immich jobs: skip to save B2 cost
                  restic backup -o s3.connections=16 --pack-size 32 --host immich /data --exclude /data/thumbs --exclude /data/encoded-video --tag immich
                  restic forget --group-by tags --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
                  restic check --read-data-subset=2%
              env:
                # Repo v2 (default for new repos) supports compression
                - name: RESTIC_COMPRESSION
                  value: auto
                # Status line once a minute (restic is silent without a TTY)
                - name: RESTIC_PROGRESS_FPS
                  value: "0.0167"
              envFrom:
                # Needs: RESTIC_REPOSITORY, RESTIC_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
                - secretRef:
                    name: immich-backup
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: data
              hostPath:
                path: /media/external14tb/k3s/immich
                type: Directory
