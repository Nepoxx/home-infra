name: immich-server-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images/immich-server/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep the tag suffix in sync with the base image tag in the Dockerfile.
      - uses: docker/build-push-action@v6
        with:
          context: images/immich-server
          push: true
          # GHCR repository names must be lowercase
          tags: ghcr.io/nepoxx/immich-server:v3.1.0-nv12
          cache-from: type=gha
          cache-to: type=gha,mode=max
